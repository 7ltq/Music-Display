
name: Build Music Display

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build Windows Media Bridge
        shell: pwsh
        run: |
          dotnet publish WindowsMediaBridge/WindowsMediaBridge.csproj -c Release -r win-x64 --self-contained true

      - name: Build Minecraft Mod
        shell: pwsh
        run: gradle clean build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusicDisplay-Windows
          path: build/libs/*.jar
          if-no-files-found: error

